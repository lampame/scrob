name: Fork Release

on:
  push:
    tags: ['v*-fork*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v2.6.0-fork.2 (required for manual runs)'
        required: true
        type: string

jobs:
  build:
    name: Build & push fork image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.email "ci@lampame.dev"
          git config user.name "fork-ci"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push standard image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            lampame/scrob:${{ env.APP_VERSION }}
            lampame/scrob:latest
            ghcr.io/lampame/scrob:${{ env.APP_VERSION }}
            ghcr.io/lampame/scrob:latest
          cache-from: type=gha,scope=fork-release
          cache-to: type=gha,mode=max,scope=fork-release

      - name: Build and push omnibus image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.omnibus
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            lampame/scrob:${{ env.APP_VERSION }}-omnibus
            lampame/scrob:latest-omnibus
            ghcr.io/lampame/scrob:${{ env.APP_VERSION }}-omnibus
            ghcr.io/lampame/scrob:latest-omnibus
          cache-from: type=gha,scope=fork-release-omnibus
          cache-to: type=gha,mode=max,scope=fork-release-omnibus

      - name: Create GitHub Release with linked commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Авто-нотатки: список комітів/PR між попереднім fork-тегом і новим,
          # із активними посиланнями. Якщо попереднього тегу нема — бере всі коміти.
          gh release create "${{ env.APP_VERSION }}" \
            --title "${{ env.APP_VERSION }}" \
            --generate-notes \
            --latest
