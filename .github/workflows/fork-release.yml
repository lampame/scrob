name: Fork Release

on:
  push:
    tags: ['v*-fork*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v2.6.0-fork.2 (required for manual runs)'
        required: true
        type: string

jobs:
  build:
    name: Build & push fork image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.email "ci@lampame.dev"
          git config user.name "fork-ci"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push standard image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            lampame/scrob:${{ env.APP_VERSION }}
            lampame/scrob:latest
            ghcr.io/lampame/scrob:${{ env.APP_VERSION }}
            ghcr.io/lampame/scrob:latest
          cache-from: type=gha,scope=fork-release
          cache-to: type=gha,mode=max,scope=fork-release

      - name: Build and push omnibus image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.omnibus
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            lampame/scrob:${{ env.APP_VERSION }}-omnibus
            lampame/scrob:latest-omnibus
            ghcr.io/lampame/scrob:${{ env.APP_VERSION }}-omnibus
            ghcr.io/lampame/scrob:latest-omnibus
          cache-from: type=gha,scope=fork-release-omnibus
          cache-to: type=gha,mode=max,scope=fork-release-omnibus

      - name: Generate categorized release notes (upstream vs fork)
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          CURRENT="${{ env.APP_VERSION }}"
          PREV=$(git tag -l 'v*-fork*' --sort=-version:refname | grep -v "^${CURRENT}$" | head -1 || true)

          if [ -n "$PREV" ]; then
            echo "Previous fork tag: $PREV"
            PREV_DATE=$(git log -1 --format=%as "$PREV")
            SEARCH="merged:>=${PREV_DATE}"
          else
            echo "No previous fork tag — using all merged PRs"
            SEARCH="merged:>=2020-01-01"
          fi

          UPSTREAM_FILE=$(mktemp)
          FORK_FILE=$(mktemp)
          trap 'rm -f "$UPSTREAM_FILE" "$FORK_FILE"' EXIT

          # Fetch merged PRs since previous tag, categorize by 'sync' label
          gh pr list --repo "$REPO" --state merged --search "$SEARCH" \
            --json number,title,author,url,labels --limit 100 \
            | jq -r '.[] | select(.labels | map(.name) | contains(["sync"])) | "* \(.title) by @\(.author.login) in \(.url)"' \
            > "$UPSTREAM_FILE" 2>/dev/null || true

          gh pr list --repo "$REPO" --state merged --search "$SEARCH" \
            --json number,title,author,url,labels --limit 100 \
            | jq -r '.[] | select(.labels | map(.name) | contains(["sync"]) | not) | "* \(.title) by @\(.author.login) in \(.url)"' \
            > "$FORK_FILE" 2>/dev/null || true

          # --- Build markdown ---
          {
            echo "## What's Changed"
            echo ""

            if [ -s "$UPSTREAM_FILE" ]; then
              echo "### 🔄 Upstream Changes"
              echo ""
              cat "$UPSTREAM_FILE"
              echo ""
            fi

            if [ -s "$FORK_FILE" ]; then
              echo "### 🍴 Fork Changes"
              echo ""
              cat "$FORK_FILE"
              echo ""
            fi

            if [ ! -s "$UPSTREAM_FILE" ] && [ ! -s "$FORK_FILE" ]; then
              echo "_No PRs found since previous release._"
              echo ""
            fi

            # Full changelog link
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV}...${CURRENT}"
            fi
          } > release_notes.md

          echo "=== Generated release notes ==="
          cat release_notes.md
          echo "================================"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.APP_VERSION }}" \
            --title "${{ env.APP_VERSION }}" \
            --notes-file release_notes.md \
            --latest
