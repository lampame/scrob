services:
  scrob:
    container_name: scrob
    image: lampame/scrob:latest-omnibus
    restart: unless-stopped
    ports:
      - "7330:7330"
    environment:
      # ── Security ────────────────────────────────────────────────────────────
      # Generate with: openssl rand -hex 32
      SECRET_KEY: changeme

      # ── Registrations ────────────────────────────────────────────────────────
      # Registrations are disabled by default. Set to true to allow additional users.
      # ENABLE_REGISTRATIONS: "true"
      # REGISTRATION_MAX_ALLOWED_USERS: "0"  # 0 = unlimited

      # ── Nuvio (optional) ───────────────────────────────────────────────────
      # Set this to the anon/public key when using a self-hosted Nuvio backend.
      # NUVIO_APP_ANON_KEY: ""

      # ── ARVIO (optional) ────────────────────────────────────────────────────
      # Overrides the embedded public anon key for auth.arvio.tv. Leave unset
      # to use the official key.
      # ARVIO_APP_ANON_KEY: ""

      # ── OIDC (optional) ─────────────────────────────────────────────────────
      # OIDC_ENABLED: "false"
      # OIDC_PROVIDER_NAME: SSO
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_AUTH_URL: ""
      # OIDC_TOKEN_URL: ""
      # OIDC_USERINFO_URL: ""
      # OIDC_REDIRECT_URL: http://your-server:7330/oidc-callback
      # OIDC_LOGOUT_URL: ""
      # OIDC_SCOPES: "openid email profile"
      # OIDC_IDENTIFIER_FIELD: email
      # OIDC_AUTO_CREATE_USERS: "true"
      # OIDC_DISABLE_PASSWORD_LOGIN: "false"

      # ── User & timezone ──────────────────────────────────────────────────────
      # Run the process as a specific user/group (defaults to 1000:1000)
      # PUID: "1000"
      # PGID: "1000"
      TZ: UTC

      # ── Advanced ─────────────────────────────────────────────────────────────
      # To use an external PostgreSQL instance instead of the embedded one,
      # set DATABASE_URL and the embedded database will be skipped entirely.
      # DATABASE_URL: postgresql+asyncpg://user:password@host:5432/scrob

      # Override the internal backend port (only needed if 7331 conflicts on bare metal)
      # BACKEND_PORT: "7331"
      # Optional pool-tuning for low-connection managed PostgreSQL (e.g. Aiven free tier). Unset = app defaults. Harmless when the embedded DB is used.
      # DB_POOL_SIZE: "20"
      # DB_MAX_OVERFLOW: "10"
      # DB_POOL_TIMEOUT: "30"
      # DB_POOL_RECYCLE: "1800"
      # DB_POOL_PRE_PING: "true"

      # ── Socket (optional) ──────────────────────────────────────────────────
      # WebSocket settings are managed in the admin panel (Settings → WebSocket).
      # Only the internal server port is needed here (only if 7332 conflicts).
      # SOCKET_INTERNAL_PORT: "7332"
    volumes:
      - scrob_data:/app/backend/data
      - scrob_db:/app/postgres/data

volumes:
  scrob_data:
  scrob_db:
